  .placeholder-notice p { font-size: 0.95rem; color: var(--ink-muted); line-height: 1.7; }
  .placeholder-notice strong { color: var(--ink); }

  footer { border-top: 1px solid var(--rule); padding: 2rem 5vw; text-align: center; font-size: 0.78rem; color: var(--ink-muted); margin-top: 4rem; }
